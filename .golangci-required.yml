version: "2"
# The most valuable linters; they are required to pass for PR to be merged.
linters:
  default: none
  enable:
    - depguard
    - govet
    - ineffassign
    - staticcheck
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the "errors" package instead
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
